name: Build, Test, and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write    

jobs:
  # Job 1: Build the Docker image
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Docker (it's pre-installed on ubuntu-latest)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t hello-world:${{ github.sha }} .
          docker build -t hello-world:latest .
      
      # Step 4: Test the Docker image by running it
      - name: Test Docker image
        run: |
          docker run -d -p 8080:80 hello-world:latest
          sleep 2
          curl http://localhost:8080 || echo "Server check failed"
      
      # Step 5: (Optional) Log in to Docker Hub and push the image
      # Uncomment the next section if you want to push to Docker Hub
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push Docker image to Docker Hub
      #   run: |
      #     docker tag hello-world:latest ${{ secrets.DOCKER_USERNAME }}/hello-world:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/hello-world:latest

      # Step 6: Save Docker image as tar file for release
      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save hello-world:latest -o hello-world-${{ github.sha }}.tar

  # Job 2: Create GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Build Docker image again for release
      - name: Build Docker image
        run: |
          docker build -t hello-world:${{ github.sha }} .
          docker build -t hello-world:latest .
      
      # Step 3: Save Docker image as tar
      - name: Save Docker image as tar
        run: |
          docker save hello-world:latest -o hello-world-${{ github.sha }}.tar
      
      # Step 4: Create GitHub Release with tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Docker Image Release
            
            **Image Details:**
            - Image: hello-world:${{ github.sha }}
            - Latest Tag: hello-world:latest
            - Commit: ${{ github.sha }}
            
            **What's included:**
            - Docker image (TAR format)
            - Dockerfile
            - Application files
            
            To load the Docker image:
            ```bash
            docker load -i hello-world-${{ github.sha }}.tar
            docker run -p 8080:80 hello-world:latest
            ```
          files: |
            hello-world-${{ github.sha }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

