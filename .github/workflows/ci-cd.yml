name: Build, Test, and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: cmd

jobs:
  # Job 1: Build the Docker image
  build:
    runs-on: self-hosted
    
    steps:
      # Step 1: Check out the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Docker (it's pre-installed on ubuntu-latest)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t hello-world:${{ github.sha }} .
          docker build -t hello-world:latest .

      # Step 6: Save Docker image as tar file for release
      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save hello-world:latest -o hello-world-${{ github.sha }}.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: hello-world-${{ github.sha }}.tar
          if-no-files-found: error

  # Job 2: Create GitHub Release
  release:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Download the image produced by the build job
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .
    
      # Step 3: Create GitHub Release with tag
      - name: Create GitHub Release with Docker image
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Docker Image Release
            
            **Image Details:**
            - Image: hello-world:${{ github.sha }}
            - Latest Tag: hello-world:latest
            - Commit: ${{ github.sha }}
            
            **What's included:**
            - Docker image (TAR format)
            - Dockerfile
            - Application files
            
            To load the Docker image:
            ```bash
            docker load -i hello-world-${{ github.sha }}.tar
            docker run -p 8080:80 hello-world:latest
            ```
          files: |
            hello-world-${{ github.sha }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Deploy the static web app to GitHub Pages
  deploy-pages:
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          

